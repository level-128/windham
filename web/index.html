<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windham Web</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }

.header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 18px; color: #4fc3f7; flex: 1; }
.header .status { font-size: 13px; color: #888; }

.panel { max-width: 1200px; margin: 20px auto; padding: 0 20px; }

.form-row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 16px; }
.form-row label { font-size: 13px; color: #aaa; display: block; margin-bottom: 4px; }
.form-row input[type=file] { background: #222; border: 1px solid #444; color: #ccc; padding: 8px; border-radius: 4px; width: 280px; }
.form-row input[type=password] { background: #222; border: 1px solid #444; color: #ccc; padding: 8px; border-radius: 4px; width: 200px; }
.form-row button { background: #0d7377; color: #fff; border: none; padding: 9px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.form-row button:hover { background: #0e9594; }
.form-row button:disabled { background: #444; cursor: not-allowed; }

.state-row { display: flex; gap: 12px; font-size: 13px; color: #888; margin-bottom: 8px; }
.state-row .fs-info { color: #4fc3f7; }

.main-layout { display: flex; gap: 16px; }
.tree-panel { flex: 1; background: #12122a; border: 1px solid #333; border-radius: 6px; overflow: auto; max-height: 70vh; }
.tree-panel .tree-header { padding: 8px 14px; font-size: 13px; color: #666; border-bottom: 1px solid #222; }
.tree-panel .tree-item { display: flex; align-items: center; padding: 4px 14px; cursor: pointer; font-size: 14px; }
.tree-panel .tree-item:hover { background: #1e1e3a; }
.tree-panel .tree-item .icon { width: 20px; color: #4fc3f7; }
.tree-panel .tree-item.dir .icon { color: #ffb74d; }
.tree-panel .tree-item .name { flex: 1; }
.tree-panel .tree-item .size { color: #666; font-size: 12px; margin-right: 8px; }
.tree-panel .tree-item .dl { color: #4fc3f7; font-size: 12px; cursor: pointer; display: none; }
.tree-panel .tree-item:hover .dl { display: inline; }
.tree-panel .tree-item .dl:hover { color: #fff; }

.log-panel { width: 380px; background: #0a0a14; border: 1px solid #333; border-radius: 6px; display: flex; flex-direction: column; max-height: 70vh; }
.log-panel .log-header { padding: 8px 14px; font-size: 13px; color: #666; border-bottom: 1px solid #222; }
.log-panel .log-body { flex: 1; overflow-y: auto; padding: 8px 14px; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
.log-panel .log-body .cmd { color: #4fc3f7; }
.log-panel .log-body .out { color: #888; }
.log-panel .log-body .err { color: #f44336; }

.loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: #666; }
.spinner { width: 24px; height: 24px; border: 3px solid #333; border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="header">
  <h1>🔐 Windham Web</h1>
  <span class="status" id="status">Ready</span>
</div>

<div class="panel">
  <div class="form-row">
    <div>
      <label>Encrypted disk image</label>
      <input type="file" id="fileInput">
    </div>
    <div>
      <label>Passphrase</label>
      <input type="password" id="passInput" placeholder="Enter passphrase">
    </div>
    <button id="openBtn" disabled>Open Disk</button>
  </div>

  <div class="state-row" id="stateRow" style="display:none">
    <span class="fs-info" id="fsInfo"></span>
    <span id="diskInfo"></span>
    <span id="memInfo" style="margin-left:auto"></span>
  </div>

  <div class="main-layout" id="mainLayout" style="display:none">
    <div class="tree-panel">
      <div class="tree-header">
        <span id="breadcrumb">/</span>
      </div>
      <div id="fileTree"></div>
    </div>
    <div class="log-panel">
      <div class="log-header">Shell log</div>
      <div class="log-body" id="logBody"></div>
    </div>
  </div>

  <div id="loadingArea" class="loading" style="display:none">
    <div class="spinner"></div> Deriving key...
  </div>
</div>

<script src="windham.js"></script>
<script src="app.js"></script>
</body>
</html>
